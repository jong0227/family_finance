name: family_finance
description: "Family finance app (shares subscription data with Ninedogs)."
publish_to: 'none'
version: 0.7.0+7

environment:
  sdk: ^3.12.2

dependencies:
  # Ninedogs 와 공유하는 구독 데이터 계약 (태그로 고정 — 올릴 때 두 앱 계약 버전 확인)
  ninedogs_core:
    git:
      url: https://github.com/jong0227/Ninedogs.git
      path: packages/ninedogs_core
      ref: ninedogs_core-v1.0.1
  cloud_firestore: 6.7.1
  firebase_auth: 6.5.6
  firebase_core: 4.12.1
  flutter:
    sdk: flutter
  flutter_riverpod: 3.3.2
  google_sign_in: ^7.2.0
  intl: 0.20.2
  shared_preferences: 2.5.5
  fl_chart: ^1.3.1
  http: 1.6.0
  package_info_plus: 10.2.1
  path_provider: 2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
